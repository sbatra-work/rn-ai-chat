name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (app and server, strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: App tests (Jest)
        run: npm run test:app -- --ci

      - name: Server tests (node:test)
        run: npm run test:server
